<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.5" stop-color="#140a33"/>
      <stop offset="1" stop-color="#07070d"/>
    </linearGradient>
    <radialGradient id="blue"><stop offset="0" stop-color="#e6f6ff"/><stop offset="0.35" stop-color="#3da5ff"/><stop offset="1" stop-color="#1b3cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="red"><stop offset="0" stop-color="#fff0f0"/><stop offset="0.35" stop-color="#ff3b4e"/><stop offset="1" stop-color="#a0001a" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#c4a3ff"/><stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.9"/><stop offset="1" stop-color="#3b0f9e" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="900" height="240" fill="url(#bg)"/>
  <g stroke="#6C3CE9" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/><line x1="0" y1="180" x2="900" y2="180"/>
  </g>
  <!-- blue orb -->
  <circle cx="230" cy="120" r="70" fill="url(#blue)" filter="url(#glow)">
    <animate attributeName="r" values="62;78;62" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="120" r="22" fill="#d9f0ff"/>
  <!-- red orb -->
  <circle cx="670" cy="120" r="70" fill="url(#red)" filter="url(#glow)">
    <animate attributeName="r" values="78;62;78" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="120" r="22" fill="#ffe0e3"/>
  <!-- purple orb -->
  <circle cx="450" cy="120" r="95" fill="url(#purple)" filter="url(#glow)">
    <animate attributeName="r" values="85;105;85" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="120" r="34" fill="#f3eaff"/>
  <circle cx="450" cy="120" r="52" fill="none" stroke="#c4a3ff" stroke-width="2" stroke-opacity="0.7">
    <animate attributeName="r" values="40;130" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- energy beams -->
  <line x1="300" y1="120" x2="400" y2="120" stroke="#3da5ff" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="500" y1="120" x2="600" y2="120" stroke="#ff3b4e" stroke-width="3" stroke-opacity="0.7"/>
</svg>
